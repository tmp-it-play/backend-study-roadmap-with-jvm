name: Learning labs
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: npm ci
      - run: npm run test:practice
      - run: npm run build
      - run: ./gradlew --no-daemon test
        working-directory: examples/jvm-core
      - run: ./gradlew --no-daemon check bootJar
        working-directory: examples/orders
