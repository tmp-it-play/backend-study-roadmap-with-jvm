spring.application.name=orders-lab
server.address=127.0.0.1
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:55432/orders}
spring.datasource.username=${DB_USER:orders}
spring.datasource.password=${DB_PASSWORD:orders-local}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=true
spring.threads.virtual.enabled=true
orders.max-quantity=10
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
